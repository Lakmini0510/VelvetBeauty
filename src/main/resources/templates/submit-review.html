<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Submit Review')}"></head>
<body>

    <header th:replace="~{fragments/layout :: header}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="main-content">
        <div class="container">
            <div class="form-panel" style="max-width: 640px;">
                <div style="text-align: center; margin-bottom: 28px;">
                    <span class="badge badge-rose" style="margin-bottom: 8px;">Salon Experience</span>
                    <h2>Share Your Salon Review</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">
                        Your feedback helps us continuously elevate our beauty rituals.
                    </p>
                </div>

                <form th:action="@{/reviews/new}" method="POST" id="reviewForm" novalidate>
                    
                    <!-- Link to Completed Appointment if available -->
                    <div class="form-group" th:if="${!#lists.isEmpty(completedAppointments)}">
                        <label class="form-label" for="reviewApptSelect">
                            ✦ Link to Completed Appointment (Grants "Verified Client ✓" Badge)
                        </label>
                        <select id="reviewApptSelect" name="appointmentId" class="form-select">
                            <option value="">-- No specific appointment / General Public Review --</option>
                            <option th:each="ca : ${completedAppointments}" 
                                    th:value="${ca.id}" 
                                    th:text="'Appt Ref #' + ${ca.id} + ' — ' + ${ca.serviceName} + ' with ' + ${ca.stylistName} + ' on ' + ${ca.appointmentDate}">
                            </option>
                        </select>
                    </div>

                    <!-- Service Selection -->
                    <div class="form-group">
                        <label class="form-label" for="reviewServiceSelect">Select Service Reviewed</label>
                        <select id="reviewServiceSelect" name="serviceId" class="form-select" required>
                            <option value="" disabled selected>-- Choose Service --</option>
                            <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                        <small class="field-error" id="revServiceErr">Please select a service.</small>
                    </div>

                    <!-- Stylist Selection -->
                    <div class="form-group">
                        <label class="form-label" for="reviewStylistSelect">Select Stylist Reviewed</label>
                        <select id="reviewStylistSelect" name="stylistId" class="form-select" required>
                            <option value="" disabled selected>-- Choose Stylist --</option>
                            <option th:each="st : ${stylists}" th:value="${st.id}" th:text="${st.name} + ' (' + ${st.specialty} + ')'"></option>
                        </select>
                        <small class="field-error" id="revStylistErr">Please select a stylist.</small>
                    </div>

                    <!-- Star Rating (1-5) -->
                    <div class="form-group">
                        <label class="form-label" for="reviewRating">Star Rating (1 to 5 Stars)</label>
                        <select id="reviewRating" name="rating" class="form-select" required>
                            <option value="5" selected>★★★★★ - Exceptional (5/5)</option>
                            <option value="4">★★★★☆ - Very Good (4/5)</option>
                            <option value="3">★★★☆☆ - Average (3/5)</option>
                            <option value="2">★★☆☆☆ - Needs Improvement (2/5)</option>
                            <option value="1">★☆☆☆☆ - Unsatisfactory (1/5)</option>
                        </select>
                    </div>

                    <!-- Comment -->
                    <div class="form-group">
                        <label class="form-label" for="reviewComment">Your Feedback &amp; Impressions</label>
                        <textarea id="reviewComment" name="comment" class="form-control" rows="4" 
                                  minlength="10" maxlength="1000"
                                  placeholder="Describe the treatment, stylist attentiveness, results, and salon ambiance (min 10 characters)..." required></textarea>
                        <small class="field-error" id="revCommentErr">Your feedback must be at least 10 characters and cannot contain ';;'.</small>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                        <a th:href="@{/reviews}" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary" id="reviewSubmitBtn">Publish Review</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
    (function () {
        const form = document.getElementById('reviewForm');
        const srv = document.getElementById('reviewServiceSelect');
        const sty = document.getElementById('reviewStylistSelect');
        const cmt = document.getElementById('reviewComment');
        const srvErr = document.getElementById('revServiceErr');
        const styErr = document.getElementById('revStylistErr');
        const cmtErr = document.getElementById('revCommentErr');

        cmt.addEventListener('input', () => {
            const v = cmt.value.trim();
            if (v.length < 10 || v.includes(';;')) {
                cmt.classList.add('is-invalid');
                cmtErr.style.display = 'block';
            } else {
                cmt.classList.remove('is-invalid');
                cmtErr.style.display = 'none';
            }
        });

        form.addEventListener('submit', (e) => {
            let valid = true;
            if (!srv.value) {
                srv.classList.add('is-invalid');
                srvErr.style.display = 'block';
                valid = false;
            } else {
                srv.classList.remove('is-invalid');
                srvErr.style.display = 'none';
            }
            if (!sty.value) {
                sty.classList.add('is-invalid');
                styErr.style.display = 'block';
                valid = false;
            } else {
                sty.classList.remove('is-invalid');
                styErr.style.display = 'none';
            }
            const v = cmt.value.trim();
            if (v.length < 10 || v.includes(';;')) {
                cmt.classList.add('is-invalid');
                cmtErr.style.display = 'block';
                valid = false;
            }
            if (!valid) e.preventDefault();
        });
    })();
    </script>

</body>
</html>
